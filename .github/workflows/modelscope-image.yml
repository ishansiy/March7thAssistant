name: ModelScope image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: modelscope-image
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - name: Build frontend
        working-directory: webui
        run: |
          if rg 'Authorization' src/js; then
            echo 'Reserved ModelScope header found in frontend'
            exit 1
          fi
          pnpm install --frozen-lockfile && pnpm build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ghcr.io/ishansiy/march7thassistant:latest
          labels: |
            org.opencontainers.image.source=https://github.com/ishansiy/March7thAssistant
            org.opencontainers.image.licenses=GPL-3.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify startup, authentication and persistence across container replacement
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/ishansiy/march7thassistant:latest
          docker volume create m7a-test
          for attempt in 1 2; do
            docker run -d --name m7a-test -p 7860:7860 -e WEBUI_TOKEN=ci-test-only -v m7a-test:/mnt/workspace "$image"
            ready=false
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:7860/healthz; then ready=true; break; fi
              sleep 2
            done
            if [ "$ready" != true ]; then docker logs m7a-test; exit 1; fi
            test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7860/api/accounts)" = 401
            curl -fsS -H 'X-M7A-Token: Bearer ci-test-only' http://localhost:7860/api/accounts
            curl -fsS -H 'X-M7A-Token: Bearer ci-test-only' http://localhost:7860/api/auth/me | python -c 'import json,sys; assert json.load(sys.stdin)["role"] == "admin"'
            if [ "$attempt" = 1 ]; then
              curl -fsS -X POST -H 'Content-Type: application/json' -H 'X-M7A-Token: Bearer ci-test-only' -d '{"name":"persistence-check"}' http://localhost:7860/api/accounts
            else
              curl -fsS -H 'X-M7A-Token: Bearer ci-test-only' http://localhost:7860/api/accounts | python -c 'import json,sys; assert any(a["name"] == "persistence-check" for a in json.load(sys.stdin))'
            fi
            docker exec m7a-test python -c 'from pathlib import Path; assert Path("/m7a/webui/data").resolve() == Path("/mnt/workspace/webui/data"); assert Path("/m7a/logs").resolve() == Path("/mnt/workspace/logs")'
            timeout 45s docker exec m7a-test python deploy/browser_smoke.py
            docker rm -f m7a-test
          done
      - name: Publish validated image
        run: |
          docker tag ghcr.io/ishansiy/march7thassistant:latest ghcr.io/ishansiy/march7thassistant:${{ github.sha }}
          docker push ghcr.io/ishansiy/march7thassistant:${{ github.sha }}
          docker push ghcr.io/ishansiy/march7thassistant:latest
