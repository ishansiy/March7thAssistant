name: Daily upstream update
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: daily-upstream-update
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream while retaining deployment workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash deploy/sync_upstream.sh
          git push origin HEAD:main
      - name: Explicitly trigger validated build and deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run modelscope-image.yml --ref main -f deploy=true
          echo 'Dispatched ModelScope image workflow with tests and deployment. Rebuilding also retries previously deferred deployments.' >> "$GITHUB_STEP_SUMMARY"
